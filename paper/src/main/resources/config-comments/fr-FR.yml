header:
  - 'Configuration de CrazyEnvoys'
  - 'MiniMessage accepte <#RRGGBB>, les dégradés, rainbow, les décorations, hover et click.'
  - 'Les valeurs ne sont jamais remplacées lors d’un changement de langue.'
comments:
  root:
    language: 'Langue du serveur : en-US, fr-FR, pl-PL, ru-RU ou un fichier personnalisé dans locale/.'
