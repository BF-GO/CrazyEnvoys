header:
  - 'Пульт управления волнами тайников во время «Судной недели»'
  - 'MiniMessage умеет <#RRGGBB>, gradient, rainbow, оформления, hover и click — хаос может быть красивым.'
  - 'При смене языка значения не перезаписываются: ваши настройки переживут даже рассвет.'
comments:
