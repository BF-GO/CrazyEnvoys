    - '<#ff6d00>/envoys reload</#ff6d00> <dark_gray>—</dark_gray> <gray>перезагрузить реальность.</gray>'
    - '<#ff6d00>/envoys time</#ff6d00> <dark_gray>—</dark_gray> <gray>узнать время до следующей волны или конца текущей.</gray>'
    - '<#ff6d00>/envoys drops [страница]</#ff6d00> <dark_gray>—</dark_gray> <gray>открыть карту тайников.</gray>'
    - '<#ff6d00>/envoys ignore</#ff6d00> <dark_gray>—</dark_gray> <gray>спрятаться от сводок.</gray>'
    - '<#ff6d00>/envoys flare [количество] [игрок]</#ff6d00> <dark_gray>—</dark_gray> <gray>выдать красную кнопку.</gray>'
    - '<#ff6d00>/envoys edit</#ff6d00> <dark_gray>—</dark_gray> <gray>расставить точки хаоса.</gray>'
    - '<#ff1744>/envoys start</#ff1744> <dark_gray>—</dark_gray> <gray>запустить внеплановую волну.</gray>'
    - '<#80cbc4>/envoys stop</#80cbc4> <dark_gray>—</dark_gray> <gray>остановить текущую волну.</gray>'
