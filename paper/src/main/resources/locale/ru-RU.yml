# Языковой файл CrazyEnvoys (ru-RU)
# Примеры MiniMessage: <#55AAFF>hex</#55AAFF>, <gradient:#FF5555:#55AAFF>градиент</gradient>, <rainbow>радуга</rainbow>
# Старые цвета через & можно преобразовать командой /crazyenvoys migrate -mt legacy_color_all.
player:
  no-permission: '{prefix}<red>У вас нет прав на использование этой команды.</red>'
  no-permission-to-claim: '{prefix}<red>У вас нет прав на получение этого груза.</red>'
envoys:
  already-started: '{prefix}<red>Событие грузов уже идёт. Остановите его перед запуском нового.</red>'
  force-start: '{prefix}<gray>Вы запустили событие грузов.</gray>'
  not-started: '{prefix}<red>Сейчас событие грузов не запущено.</red>'
  force-ended: '{prefix}<red>Вы завершили событие грузов.</red>'
  warning: '{prefix}<red>[<dark_red>ВНИМАНИЕ</dark_red>]</red> <gray>Событие грузов начнётся через <gold>{time}</gold>.</gray>'
  started:
    list:
      - '{prefix}<gray>Событие грузов началось. Появилось грузов: <gold>{amount}</gold>.</gray>'
  started-player:
    list:
      - '{prefix}<gray>Игрок {starter} запустил событие грузов. Появилось грузов: <gold>{amount}</gold>.</gray>'
  left:
    - '{prefix}<gold>{player}</gold> <gray>нашёл груз уровня {tier}. Осталось: <gold>{amount}</gold>.</gray>'
  ended:
    - '{prefix}<red>Событие грузов завершено. Спасибо за участие!</red>'
  not-enough-players: '{prefix}<gray>Для запуска события недостаточно игроков. Сейчас в сети: <gold>{amount}</gold>.</gray>'
  enter-editor-mode: '{prefix}<gray>Вы вошли в режим редактора.</gray>'
  leave-editor-mode: '{prefix}<gray>Вы вышли из режима редактора.</gray>'
  editor-clear-locations: '{prefix}<gray>Все точки появления в редакторе удалены.</gray>'
  editor-clear-failure: '{prefix}<red>Для очистки точек появления нужно войти в режим редактора.</red>'
  kicked-from-editor-mode: '{prefix}<red>Событие грузов активно. Остановите его или дождитесь завершения.</red>'
  add-location: '{prefix}<gray>Точка появления добавлена.</gray>'
  remove-location: '{prefix}<red>Точка появления удалена.</red>'
  time-left: '{prefix}<gray>Событие грузов завершится через <gold>{time}</gold>.</gray>'
  time-till-event:
    - '{prefix}<gray>Следующее событие грузов начнётся через <gold>{time}</gold>.</gray>'
  flare:
    used-flare: '{prefix}<gray>Вы запустили событие грузов сигнальной ракетой.</gray>'
    cant-use-flares: '{prefix}<red>У вас нет прав на использование сигнальных ракет.</red>'
    sent-flare: '{prefix}<gray>Вы выдали игроку <gold>{player}</gold> сигнальные ракеты: <gold>{amount}</gold>.</gray>'
    received-flare: '{prefix}<gray>Вы получили сигнальные ракеты: <gold>{amount}</gold>.</gray>'
  new-center: '{prefix}<gray>Новый центр случайного появления грузов установлен.</gray>'
  not-in-world-guard-region: '{prefix}<red>Сигнальную ракету можно использовать только в разрешённом регионе.</red>'
  start-ignoring-messages: '{prefix}<gray>Сообщения о сборе грузов теперь скрыты.</gray>'
  stop-ignoring-messages: '{prefix}<gray>Сообщения о сборе грузов снова отображаются.</gray>'
  cooldown-left: '{prefix}<gray>Следующий груз можно забрать через <gold>{time}</gold>.</gray>'
  countdown-in-progress: '{prefix}<gray>Грузы можно будет забирать через <gold>{time}</gold> сек.</gray>'
  drops-available: '{prefix}<gray>Доступные грузы:</gray>'
  drops-possibilities: '{prefix}<gray>Настроенные точки появления грузов:</gray>'
  drops-page: '{prefix}<gray>Используйте /crazyenvoys drops [страница], чтобы увидеть больше.</gray>'
  drops-format: '<gray>[<gold>{id}</gold>]: {world}, {x}, {y}, {z}</gray>'
  no-spawn-locations-found: '{prefix}<red>Подходящие точки появления не найдены. Событие отменено, а перезарядка сброшена.</red>'
  hologram-placeholders:
    on-going: 'Идёт'
    not-running: 'Не запущено'
  time-placeholders:
    day: 'д'
    hour: 'ч'
    minute: 'м'
    second: 'с'
  envoy-locations: '<yellow><bold>Все точки грузов:</bold></yellow>\n<red>[ID], [Мир]: [X], [Y], [Z]</red> {locations}'
  location-format: '\n<dark_gray>[<blue>{id}</blue>]</dark_gray> <red>{world}: {x}, {y}, {z}</red>'
misc:
  command-not-found: '{prefix}<red>Неизвестная команда: {command}.</red>'
  correct-usage: '{prefix}<red>Правильное использование: <yellow>{usage}</yellow></red>'
  lacking-flag: '{prefix}<red>Не указан параметр {flag}. Ожидаемый формат: <yellow>{usage}</yellow></red>'
  must-be-console-sender: '{prefix}<red>Эту команду можно выполнить только из консоли.</red>'
  player-only: '{prefix}<red>Эта команда доступна только игрокам.</red>'
  not-online: '{prefix}<red>Этот игрок не в сети.</red>'
  not-a-number: '{prefix}<red>Указанное значение не является числом.</red>'
  not-applicable: 'Н/Д'
  config-reload: '{prefix}<gray>Все файлы перезагружены.</gray>'
  help:
    - '<gold>/crazyenvoys help</gold> <gray>— показать эту справку.</gray>'
    - '<gold>/crazyenvoys reload</gold> <gray>— перезагрузить файлы конфигурации.</gray>'
    - '<gold>/crazyenvoys time</gold> <gray>— показать время до начала или завершения события.</gray>'
    - '<gold>/crazyenvoys drops [страница]</gold> <gray>— показать точки грузов.</gray>'
    - '<gold>/crazyenvoys ignore</gold> <gray>— включить или отключить сообщения о сборе.</gray>'
    - '<gold>/crazyenvoys flare [количество] [игрок]</gold> <gray>— выдать сигнальные ракеты.</gray>'
    - '<gold>/crazyenvoys edit</gold> <gray>— изменить точки появления грузов.</gray>'
    - '<gold>/crazyenvoys start</gold> <gray>— запустить событие грузов.</gray>'
    - '<gold>/crazyenvoys stop</gold> <gray>— остановить событие грузов.</gray>'
    - '<gold>/crazyenvoys center</gold> <gray>— установить центр случайного появления.</gray>'
command:
  migrate:
    error: '{prefix}<red>Не удалось преобразовать <green>{file}</green> способом <green>{type}</green>: <green>{reason}</green>.</red>'
    not-available: '{prefix}<red>Этот тип преобразования недоступен.</red>'
    plugin-not-available: '{prefix}<red>Плагин {name} не включён и не может использоваться для преобразования.</red>'
    no-envoys-available: '{prefix}<red>Нет доступных грузов для преобразования.</red>'
    success-users:
      - '<gold><bold>Результаты преобразования</bold></gold>'
      - '<green>Успешно: {succeeded_amount}</green>'
      - '<red>Ошибок: {failed_amount}</red>'
      - '<gray>Время: {time}; тип: {type}</gray>'
    success:
      - '<gold><bold>Результаты преобразования</bold></gold>'
      - '<green>Успешно: {succeeded_amount}</green>'
      - '<red>Ошибок: {failed_amount}</red>'
      - '<gray>Время: {time}; тип: {type}</gray>'
      - '<gray>Файлы:</gray>'
      - '{files}'
warnings:
  empty-tier: '<red>В уровне {tier} не найдено наград. Проверьте его конфигурацию.</red>'
ui:
  envoy-menu-title: '<red>Награды груза</red>'
  prize-load-error: '<red>Ошибка в награде: {prize}</red>'
  flare:
    name: '<bold><gray>(<dark_red>!</dark_red>)</gray></bold> <red>Сигнальная ракета</red>'
    lore:
      - '<gray>Нажмите ПКМ, чтобы</gray>'
      - '<gray>запустить событие грузов.</gray>'
  grace-period:
    unlocked: '<red>Можно забирать.</red>'
    time-unit: ' сек.'
