# Русская локаль события «Судная неделя» и его волн тайников
# MiniMessage: <#ff1744>hex</#ff1744>, <gradient:#ff1744:#7c4dff>градиент</gradient>, <rainbow>радуга</rainbow>
# Старые цвета через & можно преобразовать командой /envoys migrate -mt legacy_color_all.
player:
  no-permission: '{prefix}<gray>Система решила, что сегодня ты <#b0bec5>мирный житель</#b0bec5>. Прав на эту команду нет.</gray>'
  no-permission-to-claim: '{prefix}<red>Руки убрал от тайника.</red> <gray>Для этого тира нужны отдельные права.</gray>'
envoys:
  already-started: '{prefix}<yellow>Волна тайников уже идёт.</yellow> <gray>Второй завоз в тот же грузовик не влезет.</gray>'
  force-start: '{prefix}<gradient:#ff1744:#ff6d00>Красная кнопка нажата.</gradient> <gray>Ответственность традиционно потеряна.</gray>'
  not-started: '{prefix}<gray>Активной волны тайников сейчас нет.</gray> <dark_gray>Судная неделя при этом продолжается.</dark_gray>'
  force-ended: '{prefix}<#80cbc4>Отбой.</#80cbc4> <gray>Дубинки в шкаф, алмазы пересчитать.</gray>'
  warning: '{prefix}<gradient:#ff1744:#ff6d00><bold>СКОРО НОВЫЙ ЗАВОЗ</bold></gradient> <gray>Через <white>{time}</white> на карте появятся свежие тайники. Освободите инвентарь и моральные принципы.</gray>'
  started:
    list:
      - '{prefix}<gradient:#ff1744:#7c4dff><bold>НОВАЯ ВОЛНА ДРОПОВ</bold></gradient> <gray>На карте появилось тайников: <white>{amount}</white>.</gray>'
  started-player:
    list:
      - '{prefix}<white>{starter}</white> <gray>нажал подозрительно большую красную кнопку. Тайников: <#ff6d00>{amount}</#ff6d00>.</gray>'
  left:
    - '{prefix}<white>{player}</white> <gray>вскрыл тайник <#ff6d00>{tier}</#ff6d00> и сделал вид, что так и было. Осталось: <white>{amount}</white>.</gray>'
  ended:
    - '{prefix}<gradient:#80cbc4:#64b5f6><bold>ВОЛНА ДРОПОВ ЗАВЕРШЕНА</bold></gradient> <gray>Судная неделя продолжается.</gray>'
  wave-ended: '{prefix}<gradient:#80cbc4:#64b5f6><bold>ВОЛНА ДРОПОВ ЗАВЕРШЕНА</bold></gradient> <gray>Следующая волна начнётся через <white>{time}</white>.</gray>'
  wave-ended-manual: '{prefix}<gradient:#80cbc4:#64b5f6><bold>ВОЛНА ДРОПОВ ЗАВЕРШЕНА</bold></gradient> <gray>Следующий завоз будет после ручного запуска.</gray>'
  wave-guide:
    - '{prefix}<gray>Это только волна тайников внутри продолжающейся Судной недели. Правила сервера не включаются и не выключаются.</gray>'
    - '{prefix}<gray>Каждый тайник выдаёт одну случайную награду. Чем выше тир, тем реже такой тайник появляется в волне.</gray>'
  not-enough-players: '{prefix}<gray>В сети всего <white>{amount}</white>. Даже анархия просит приличную массовку.</gray>'
  enter-editor-mode: '{prefix}<#b388ff>Режим архитектора хаоса включён.</#b388ff> <gray>Ставь точки, но не наступай на грабли.</gray>'
  leave-editor-mode: '{prefix}<gray>Режим архитектора выключен. Чертежи хаоса сохранены.</gray>'
  editor-clear-locations: '{prefix}<gray>Все точки стёрты. Карта снова невинна и ничего не помнит.</gray>'
  editor-clear-failure: '{prefix}<red>Сначала войди в режим редактора.</red> <gray>Телепатия в сборку не вошла.</gray>'
  kicked-from-editor-mode: '{prefix}<yellow>Редактор закрыт: волна тайников уже началась.</yellow> <gray>Ремонт во время завоза запрещён.</gray>'
  add-location: '{prefix}<#b388ff>Точка хаоса добавлена.</#b388ff> <gray>Страховка на неё не действует.</gray>'
  remove-location: '{prefix}<gray>Точка удалена. Свидетелей не осталось.</gray>'
  time-left: '{prefix}<gray>До окончания текущей волны <white>{time}</white>. Успей найти свой тайник.</gray>'
  time-till-event:
    - '{prefix}<gray>Следующая волна дропов начнётся через <white>{time}</white>.</gray>'
  flare:
    used-flare: '{prefix}<gradient:#ff1744:#ff6d00>Сигнальная ракета ушла в небо.</gradient> <gray>Соседи уже пишут жалобу.</gray>'
    cant-use-flares: '{prefix}<red>Красная кнопка тебе не доверена.</red> <gray>И, кажется, не зря.</gray>'
    sent-flare: '{prefix}<gray>Игроку <white>{player}</white> выдано ракет: <#ff6d00>{amount}</#ff6d00>. Ничего хорошего не ждём.</gray>'
    received-flare: '{prefix}<gray>Ты получил ракет: <#ff6d00>{amount}</#ff6d00>. Прочитай инструкцию. Или хотя бы попрощайся.</gray>'
  new-center: '{prefix}<#b388ff>Эпицентр хаоса перенесён.</#b388ff> <gray>Риелторы уже снижают цены.</gray>'
  not-in-world-guard-region: '{prefix}<red>Здесь ракету запускать нельзя.</red> <gray>У хаоса тоже есть кадастровый план.</gray>'
  start-ignoring-messages: '{prefix}<gray>Сводки о вскрытиях скрыты. Режим «моя хата с краю» включён.</gray>'
  stop-ignoring-messages: '{prefix}<gray>Сводки снова видны. Любопытство победило инстинкт самосохранения.</gray>'
  cooldown-left: '{prefix}<yellow>Жадность на перезарядке ещё <white>{time}</white>.</yellow> <gray>Подыши, тайник не убежит.</gray>'
  countdown-in-progress: '{prefix}<gray>Тайники откроются через <white>{time}</white> сек. Ломать сундук взглядом бесполезно.</gray>'
  drops-available: '{prefix}<gradient:#ff6d00:#ff1744><bold>ТАЙНИКИ НА РАДАРЕ</bold></gradient>'
  drops-possibilities: '{prefix}<gradient:#7c4dff:#ff1744><bold>ВОЗМОЖНЫЕ ТОЧКИ ХАОСА</bold></gradient>'
  drops-hint: '{prefix}<click:run_command:''/envoys drops''><hover:show_text:''<gray>Нажми — штаб сольёт координаты.</gray>''><gradient:#ff6d00:#ff1744><bold>[ОТКРЫТЬ КАРТУ ТАЙНИКОВ]</bold></gradient></hover></click> <dark_gray>Бюджет на разведку освоен.</dark_gray>'
  spawn-area: '{prefix}<gray>Зона поиска: до <white>{max}</white> блоков по X/Z от эпицентра <white>{world} ({x}, {z})</white>. Ближе <white>{min}</white> блоков тайники не появляются.</gray>'
  drops-page: '{prefix}<gray>Больше координат: <white>/envoys drops [страница]</white>. Да, карта сокровищ многостраничная.</gray>'
  drops-format: '<dark_gray>[</dark_gray><#ff6d00>{id}</#ff6d00><dark_gray>]</dark_gray> <gray>{world}</gray> <dark_gray>•</dark_gray> <white>{x}, {y}, {z}</white>'
  no-spawn-locations-found: '{prefix}<red>Мир отказался принимать тайники.</red> <gray>Событие отменено, перезарядка сброшена.</gray>'
  hologram-placeholders:
    on-going: 'Волна дропов идёт'
    not-running: 'Ожидание следующей волны'
  time-placeholders:
    day: 'д'
    hour: 'ч'
    minute: 'м'
    second: 'с'
  envoy-locations: '<gradient:#ff1744:#ff6d00><bold>ВСЕ ТАЙНИКИ</bold></gradient><newline><dark_gray>[№] [Мир]: [X], [Y], [Z]</dark_gray>{locations}'
  location-format: '<newline><dark_gray>[</dark_gray><#ff6d00>{id}</#ff6d00><dark_gray>]</dark_gray> <gray>{world}</gray><dark_gray>:</dark_gray> <white>{x}, {y}, {z}</white>'
  world-names:
    overworld: 'Обычный мир'
    nether: 'Нижний мир'
    end: 'Край'
misc:
  command-not-found: '{prefix}<red>Команда {command} скрылась в неизвестном направлении.</red>'
  correct-usage: '{prefix}<gray>Попробуй без паники: <white>{usage}</white></gray>'
  lacking-flag: '{prefix}<red>Потерялся параметр {flag}.</red> <gray>Рабочая схема: <white>{usage}</white></gray>'
  must-be-console-sender: '{prefix}<red>Эта кнопка находится только в консоли.</red>'
  player-only: '{prefix}<red>Консоль сегодня не участвует. Нужен живой игрок.</red>'
  not-online: '{prefix}<gray>Игрок не в сети. Возможно, первым почуял неладное.</gray>'
