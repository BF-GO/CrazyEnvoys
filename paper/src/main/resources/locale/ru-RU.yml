  done: 'Готово ({time})!'
  config-migrated: 'Файл {file} успешно преобразован.'
  prize-error: 'Ошибка при загрузке награды {prize}.'
  locations-retry: 'Не удалось загрузить точек: {amount}. Повторная попытка через 10 секунд.'
  recovery-error: 'Восстановление при запуске завершилось с ошибками: {error}'
  hologram-enabled: 'Поддержка {plugin} включена.'
