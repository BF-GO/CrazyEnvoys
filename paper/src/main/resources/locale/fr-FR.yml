    - '<gold>/crazyenvoys drops [page]</gold> <gray>- Affiche les emplacements.</gray>'
    - '<gold>/crazyenvoys ignore</gold> <gray>- Active ou masque les messages de collecte.</gray>'
    - '<gold>/crazyenvoys flare [quantité] [joueur]</gold> <gray>- Donne des fusées.</gray>'
    - '<gold>/crazyenvoys edit</gold> <gray>- Modifie les emplacements.</gray>'
    - '<gold>/crazyenvoys start</gold> <gray>- Démarre le largage.</gray>'
    - '<gold>/crazyenvoys stop</gold> <gray>- Arrête le largage.</gray>'
    - '<gold>/crazyenvoys center</gold> <gray>- Définit le centre aléatoire.</gray>'
