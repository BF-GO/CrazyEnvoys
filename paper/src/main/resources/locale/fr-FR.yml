# Fichier de langue CrazyEnvoys (fr-FR)
# MiniMessage : <#55AAFF>hex</#55AAFF>, <gradient:#FF5555:#55AAFF>dégradé</gradient>, <rainbow>arc-en-ciel</rainbow>
player:
