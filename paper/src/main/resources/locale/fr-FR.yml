      - '<gold><bold>Résultats de la migration</bold></gold>'
      - '<green>Réussites : {succeeded_amount}</green>'
      - '<red>Échecs : {failed_amount}</red>'
      - '<gray>Durée : {time} ; type : {type}</gray>'
      - '<gray>Fichiers :</gray>'
      - '{files}'
