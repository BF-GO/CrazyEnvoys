# Стандартный удачный уровень. Технические идентификаторы материалов и команд не переводятся.
Settings:
  Claim-Permission: false
  Claim-Permission-Name: 'lucky.envoy.use'
  Prize-Message:
    - '<gray>Вы получили <yellow>{reward}</yellow> из груза <yellow>{tier}</yellow>.</gray>'
  Spawn-Chance: 25
  Use-Chance: true
  Placed-Block: 'ENDER_CHEST'
  Bulk-Prizes:
    Toggle: false
    Random: true
    Max-Bulk: 3
  Hologram-Toggle: true
  Hologram-Height: 1.5
  Hologram-Range: 8
  Hologram:
    - '<gray><bold>(<yellow>!</yellow>) <yellow>Удачный груз</yellow></bold></gray>'
    - '%crazyenvoys_crates_time%'
  Firework-Toggle: true
  Firework-Colors: ['Gray', 'Black', 'Yellow']
  Signal-Flare:
    Toggle: true
    Time: '25s'
    Colors: ['Gray', 'Black', 'Yellow']
# Доступные параметры предметов: item, amount, name, lore, glowing, damage,
# unbreakable-item, enchantment, trim-pattern, trim-material и custom-model-data.
Prizes:
  '1':
    DisplayName: '<green>$10,000</green>'
    Chance: 50
    Messages:
      - '<gray>Вы нашли {reward}.</gray>'
    Commands:
      - 'eco give {player} 10000'
  '2':
    DisplayName: '<yellow>Удачный меч</yellow>'
    Chance: 25
    Drop-Items: false
    Messages:
      - '<gray>Поздравляем! Вы выиграли {reward}.</gray>'
    Items:
      - 'item:diamond_sword, amount:1, name:<yellow>Удачный меч</yellow>, sharpness:2, unbreaking:1, knockback:1, fire_aspect:1, looting:1'
  '3':
    DisplayName: '<yellow>Удачная броня</yellow>'
    Chance: 10
    Drop-Items: false
    Messages:
      - '<gray>Поздравляем! Вы выиграли комплект {reward}.</gray>'
    Items:
      - 'item:diamond_helmet, damage:50, trim-pattern:sentry, trim-material:quartz, amount:1, name:<yellow>Удачный шлем</yellow>, protection:2, unbreaking:1'
      - 'item:diamond_chestplate, damage:50, trim-pattern:dune, trim-material:redstone, amount:1, name:<yellow>Удачный нагрудник</yellow>, protection:2, unbreaking:1'
      - 'item:diamond_leggings, damage:50, trim-pattern:host, trim-material:copper, amount:1, name:<yellow>Удачные поножи</yellow>, protection:2, unbreaking:1'
      - 'item:diamond_boots, damage:50, trim-pattern:shaper, trim-material:gold, amount:1, name:<yellow>Удачные ботинки</yellow>, protection:2, unbreaking:1'
