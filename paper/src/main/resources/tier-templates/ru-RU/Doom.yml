# Судный тир: максимум один на событие. Если увидел — дружба официально приостановлена.
Settings:
  Template-Version: 3
  Display-Name: '<gradient:#ff1744:#651fff><bold>СУДНЫЙ</bold></gradient>'
  Max-Per-Event: 1
  Rare-Enchantments:
    Armor-Breaker:
      Toggle: true
      Chance: 0.5
      Level: 3
  Armor-Set:
    Id: 'doom_plot_armor'
    Display-Name: '<gradient:#ff1744:#651fff>Костюм бессюжетной брони</gradient>'
    Effects: ['strength:3', 'speed:2', 'resistance:2', 'fire_resistance:1', 'regeneration:1']
  Claim-Permission: false
  Claim-Permission-Name: 'doom.envoy.use'
  Prize-Message:
    - '<gray>Судный тайник выбрал тебя и выдал <gradient:#ff1744:#651fff>{reward}</gradient>. Баланс объявлен пропавшим.</gray>'
  Spawn-Chance: 2
  Use-Chance: true
  Placed-Block: 'LODESTONE'
  Bulk-Prizes:
    Toggle: false
    Random: true
    Max-Bulk: 1
  Hologram-Toggle: true
  Hologram-Height: 1.7
  Hologram-Range: 12
  Hologram:
    - '<gradient:#ff1744:#651fff><bold>СУДНЫЙ ТАЙНИК</bold></gradient>'
    - '<red>ОДИН НА ВСЮ КАРТУ</red>'
    - '<dark_gray>Здесь дружба проходит нагрузочный тест.</dark_gray>'
    - '%crazyenvoys_crates_time%'
  Firework-Toggle: true
  Firework-Colors: ['Red', 'Purple', 'Black', 'White']
  Signal-Flare:
    Toggle: true
    Time: '50s'
    Colors: ['Red', 'Purple', 'Black', 'White']
